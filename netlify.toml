[build]
  base    = "devote-ui"
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"           # Treat React warnings as warnings, not errors

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200           # SPA fallback — keeps /#sauti hash routing working
